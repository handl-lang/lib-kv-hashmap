[package]
name = "handl-plugin-lib-kv-hashmap"
version = "0.1.0"
edition = "2024"
description = "In-memory [`HashMap`]-backed [`KeyValueStore`] implementation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-kv-hashmap"

[dependencies]
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
handl-plugin-lib-kv = { git = "https://github.com/handl-lang/lib-kv", branch = "main" }

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }

[patch."https://github.com/handl-lang/lib-kv"]
handl-plugin-lib-kv = { path = "../lib-kv" }

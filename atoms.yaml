# lib-kv-hashmap atom spec (P-013/T-151) — `kv.*` atoms backed by the
# in-memory `HashKeyValueStore` (all impls share one store instance, so
# state persists across calls — same contract as `kv_hashmap_op_registry`).
#
# The IDL: name = dispatch key, sig = handl signature (~> canonical, from
# the stripped `op` decls in handl-packages/kv_hashmap/kv_hashmap.hnl),
# impl = key into `kv_impls()` (src/lib.rs). Consumed by the spec-driven
# registry path (`atoms::registry_from_atoms_kernel`) in
# `handl-kit-stdlib`'s `kv-hashmap` library row.
module: kv
atoms:
  # `kv.get`'s old decl sig was `String ~> String?` — the `?` suffix is
  # outside the sig grammar (`sig_to_type_value` rejects trailing `?`),
  # and the pre-T-151 path attached no signature for it either, so the
  # atom stays unsigned here too.
  - { name: kv.get, impl: kv_get }
  - { name: kv.set, sig: "(String * String) ~> Unit", impl: kv_set }
  - { name: kv.remove, sig: "String ~> Unit", impl: kv_remove }
  - { name: kv.clear, sig: "Unit ~> Unit", impl: kv_clear }
  - { name: kv.has, sig: "String ~> Bool", impl: kv_has }
  - { name: kv.size, sig: "Unit ~> Int", impl: kv_size }
